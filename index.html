<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker | ElijahAmogsus</title>
  <style>
    :root {
      --base: #1e1e2e;
      --mantle: #181825;
      --surface0: #313244;
      --surface1: #45475a;
      --text: #cdd6f4;
      --subtext0: #a6adc8;
      --blue: #89b4fa;
      --pink: #f38ba8;
      --crust: #11111b;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--base);
      color: var(--text);
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 20px;
    }

    .theme-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .theme-btn {
      background-color: var(--mantle);
      color: var(--text);
      border: 2px solid var(--surface1);
      border-radius: 6px;
      padding: 6px 14px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
    }

    .theme-btn:hover, .theme-btn.active {
      border-color: var(--blue);
      background-color: var(--surface0);
    }

    h1 { color: var(--blue); margin: 0 0 6px 0; }
    p { color: var(--subtext0); margin: 0 0 25px 0; text-align: center; }

    .picker-box {
      background: var(--mantle);
      border: 2px solid var(--surface1);
      border-radius: 12px;
      padding: 22px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .upload-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: var(--surface0);
      padding: 12px;
      border-radius: 8px;
    }

    .upload-label {
      font-weight: bold;
      color: var(--blue);
    }

    input[type="file"] {
      width: 100%;
      color: var(--text);
      font-family: monospace;
    }

    #imgCanvas {
      max-width: 100%;
      max-height: 300px;
      border: 2px solid var(--blue);
      border-radius: 6px;
      cursor: crosshair;
      display: none;
    }

    .preview {
      width: 100%;
      height: 90px;
      border-radius: 8px;
      border: 2px solid var(--surface1);
      background: #89b4fa;
    }

    input[type="color"] {
      width: 100%;
      height: 45px;
      border: none;
      background: none;
      cursor: pointer;
    }

    .codes {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .code-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface0);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .copy-btn {
      background: var(--blue);
      color: var(--crust);
      border: none;
      border-radius: 5px;
      padding: 6px 12px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
    }

    .copy-btn:hover { opacity: 0.9; }

    a.back {
      margin-top: 25px;
      color: var(--pink);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="theme-bar">
    <button class="theme-btn active" onclick="setTheme('mocha', this)">🌿 Mocha</button>
    <button class="theme-btn" onclick="setTheme('macchiato', this)">🌺 Macchiato</button>
    <button class="theme-btn" onclick="setTheme('frappe', this)">🪴 Frappé</button>
    <button class="theme-btn" onclick="setTheme('latte', this)">🌻 Latte</button>
  </div>

  <h1>🎨 Color Picker</h1>
  <p>Upload an image & tap any pixel, or use the color picker below</p>

  <div class="picker-box">
    <div class="upload-section">
      <span class="upload-label">🖼️ Pick Color From Image</span>
      <input type="file" id="imgUpload" accept="image/*">
      <canvas id="imgCanvas"></canvas>
    </div>

    <div class="preview" id="preview"></div>
    <input type="color" id="picker" value="#89b4fa">

    <div class="codes">
      <div class="code-row">
        <span id="hexVal">#89B4FA</span>
        <button class="copy-btn" onclick="copyText('hexVal', this)">Copy</button>
      </div>
      <div class="code-row">
        <span id="rgbVal">rgb(137, 180, 250)</span>
        <button class="copy-btn" onclick="copyText('rgbVal', this)">Copy</button>
      </div>
      <div class="code-row">
        <span id="hslVal">hsl(217, 92%, 76%)</span>
        <button class="copy-btn" onclick="copyText('hslVal', this)">Copy</button>
      </div>
    </div>
  </div>

  <a class="back" href="/">← Back to Dev Hub</a>

  <script>
    const themes = {
      mocha: { base: '#1e1e2e', mantle: '#181825', surface0: '#313244', surface1: '#45475a', text: '#cdd6f4', subtext0: '#a6adc8', blue: '#89b4fa', pink: '#f38ba8', crust: '#11111b' },
      macchiato: { base: '#24273a', mantle: '#1e2030', surface0: '#363a4f', surface1: '#494d64', text: '#cad3f5', subtext0: '#a5adcb', blue: '#8aadf4', pink: '#f5bde6', crust: '#181926' },
      frappe: { base: '#303446', mantle: '#292c3c', surface0: '#414559', surface1: '#51576d', text: '#c6d0f5', subtext0: '#a5adce', blue: '#8caaee', pink: '#f4b8e4', crust: '#232634' },
      latte: { base: '#eff1f5', mantle: '#e6e9ef', surface0: '#ccd0da', surface1: '#bcc0cc', text: '#4c4f69', subtext0: '#6c6f85', blue: '#1e66f5', pink: '#ea76cb', crust: '#eff1f5' }
    };

    function setTheme(name, btn) {
      const palette = themes[name];
      const root = document.documentElement.style;
      for (const [key, value] of Object.entries(palette)) {
        root.setProperty(`--${key}`, value);
      }
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      localStorage.setItem('catppuccin-theme', name);
    }

    const saved = localStorage.getItem('catppuccin-theme');
    if (saved && themes[saved]) {
      setTheme(saved, document.querySelector(`button[onclick*="${saved}"]`));
    }

    const picker = document.getElementById('picker');
    const preview = document.getElementById('preview');
    const hexVal = document.getElementById('hexVal');
    const rgbVal = document.getElementById('rgbVal');
    const hslVal = document.getElementById('hslVal');
    const imgUpload = document.getElementById('imgUpload');
    const imgCanvas = document.getElementById('imgCanvas');
    const ctx = imgCanvas.getContext('2d');

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function updateColor(hex) {
      picker.value = hex;
      preview.style.backgroundColor = hex;
      hexVal.textContent = hex.toUpperCase();

      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      rgbVal.textContent = `rgb(${r}, ${g}, ${b})`;

      const rNorm = r / 255, gNorm = g / 255, bNorm = b / 255;
      const max = Math.max(rNorm, gNorm, bNorm), min = Math.min(rNorm, gNorm, bNorm);
      let h, s, l = (max + min) / 2;

      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case rNorm: h = (gNorm - bNorm) / d + (gNorm < bNorm ? 6 : 0); break;
          case gNorm: h = (bNorm - rNorm) / d + 2; break;
          case bNorm: h = (rNorm - gNorm) / d + 4; break;
        }
        h /= 6;
      }
      hslVal.textContent = `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
    }

    imgUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          imgCanvas.width = img.width;
          imgCanvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          imgCanvas.style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    imgCanvas.addEventListener('click', (e) => {
      const rect = imgCanvas.getBoundingClientRect();
      const scaleX = imgCanvas.width / rect.width;
      const scaleY = imgCanvas.height / rect.height;
      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);
      const pixel = ctx.getImageData(x, y, 1, 1).data;
      const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
      updateColor(hex);
    });

    function copyText(id, btn) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text);
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = old, 1000);
    }

    picker.oninput = (e) => updateColor(e.target.value);
  </script>
</body>
</html>
